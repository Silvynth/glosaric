[package]
name = "glosaric"
version = "0.1.0"
edition = "2021"
authors = ["Silvynth <silvynth@local>"]
description = "Deterministic code navigation and dual-glossary generator for developers and AI agents"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"
walkdir = "2.5"
colored = "2.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
